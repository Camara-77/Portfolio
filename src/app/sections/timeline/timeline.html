<section id="timeline" class="section timeline" aria-labelledby="timeline-title">
  <div class="container">
    <app-section-title index="05" label="Parcours" title="Parcours" headingId="timeline-title" />

    <ol class="timeline__list" #list>
      <li class="timeline__rail" aria-hidden="true">
        <span class="timeline__progress"></span>
      </li>

      @for (item of items; track item.date) {
        <li class="timeline__item">
          <span class="timeline__dot" aria-hidden="true"></span>
          <p class="timeline__date">
            @if (item.todo) {
              <span class="todo">{{ item.date }}</span>
            } @else {
              {{ item.date }}
            }
          </p>
          <app-glass-card class="timeline__content">
            @if (item.award) {
              <span class="timeline__award" aria-hidden="true"><app-icon name="trophy" /></span>
            }
            <h3 class="timeline__title h3">{{ item.title }}</h3>
            @if (item.place) {
              <p class="timeline__place">{{ item.place }}</p>
            }
          </app-glass-card>
        </li>
      }
    </ol>
  </div>
</section>
