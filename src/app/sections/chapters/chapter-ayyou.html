<section [id]="c.id" class="chapter" aria-labelledby="ayyou-title" data-chapter="ayyou">
  <div class="container chapter__grid">
    <div class="chapter__text">
      <app-chapter-head [index]="c.index" [label]="c.label" [period]="c.period" headingId="ayyou-title">
        {{ c.title }}
      </app-chapter-head>

      <!-- L'origine -->
      <div class="ay__origin">
        <p class="ay__quote">{{ c.origin[0] }}</p>
        <p class="lead">{{ c.summary }}</p>
      </div>

      <!-- Architecture en une ligne, chaque maillon mène à son dépôt -->
      <p class="ay__pipeline">
        @for (step of c.pipeline; track step.label; let last = $last) {
          <a class="ay__step" [href]="step.repo.href" target="_blank" rel="noopener"
             [attr.aria-label]="step.label + ' — dépôt ' + step.repo.display + ' sur GitHub'">{{ step.label }}</a>
          @if (!last) {
            <span class="ay__arrow" aria-hidden="true">→</span>
          }
        }
      </p>

      <!-- Trois grands chiffres -->
      <ul class="ay__figures">
        @for (f of c.figures; track f.label) {
          <li class="ay__figure">
            <span class="ay__figure-value"><app-num-text [text]="f.value" /></span>
            <span class="ay__figure-label">{{ f.label }}</span>
          </li>
        }
      </ul>

      <div class="ay__buttons">
        <a appButton [href]="site.href" target="_blank" rel="noopener">
          {{ site.display }}
          <app-icon name="arrow-up-right" />
        </a>
        <a appButton variant="ghost" [href]="org.href" target="_blank" rel="noopener">
          <app-icon name="github" />
          GitHub
        </a>
        <button
          appButton
          variant="ghost"
          type="button"
          aria-haspopup="dialog"
          [attr.aria-label]="c.award.label + ' — voir les ' + c.award.photos.length + ' photos'"
          (click)="gallery.open()"
        >
          <app-icon name="trophy" />
          Voir les photos · {{ c.award.photos.length }}
        </button>
      </div>
      <app-award-gallery #gallery [award]="c.award" />

      <!-- Autres projets : repliés par défaut -->
      <details class="ay__others">
        <summary>{{ c.othersToggle }}</summary>
        <app-project-list [projects]="c.others" variant="link" />
      </details>
    </div>
    <app-scene class="chapter__visual" name="ayyou" [crop]="true" appReveal />
  </div>
</section>
