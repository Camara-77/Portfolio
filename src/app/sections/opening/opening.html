<section id="top" class="op">
  <div class="op__stage">
    <!-- Les trois mots, en plein, DERRIÈRE le portrait (z-index 1) -->
    <h1 class="op__words" aria-label="Aïssatou Combe Camara">
      <span class="op__line op__line--first" aria-hidden="true"
        >A<span class="op__i">I</span><span class="op__trema"><span class="op__dot"></span><span class="op__dot op__dot--2"></span></span>SSATOU</span
      >
      <span class="op__line op__line--mid" aria-hidden="true">COMBE</span>
      <span class="op__line op__line--last" aria-hidden="true"><span class="op__wide">CAMARA</span></span>
    </h1>

    <!-- Portrait détouré, devant les mots (z-index 2), effet orange au survol -->
    <div class="op__portrait">
      <app-portrait [alt]="'Portrait de ' + id.name" />
    </div>
  </div>

  <div class="op__foot">
    <p class="op__title">{{ id.title }}</p>
    <p class="op__phrase">{{ o.phrase }}</p>
  </div>
</section>

<!-- Note vocale d'introduction -->
<section class="op-voice" [attr.aria-label]="'Note vocale : ' + o.voice.label">
  <app-voice-wave
    variant="intro"
    [src]="o.voice.src"
    [analysisSrc]="o.voice.analysisSrc"
    [label]="o.voice.label"
    [transcript]="o.voice.transcript"
  />
</section>
