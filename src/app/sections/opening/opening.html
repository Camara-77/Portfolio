<section id="top" class="op" aria-labelledby="opening-title">
  <h1 id="opening-title" class="sr-only">{{ id.name }} — {{ id.title }}</h1>

  <p class="op__kicker" aria-hidden="true">{{ o.kicker }}</p>

  <div class="op__stage">
    <!-- z-index 1 : COMBE, derrière le portrait (la tête passe devant) -->
    <p class="op__line op__line--back" aria-hidden="true">{{ o.lines[0] }}</p>

    <!-- z-index 2 : portrait détouré, effet orange au survol -->
    <div class="op__portrait">
      <app-portrait [alt]="'Portrait de ' + id.name" />
    </div>

    <!-- z-index 3 : CAMARA, devant le portrait (sur le buste), sans bloquer le survol -->
    <p class="op__line op__line--front" aria-hidden="true">{{ o.lines[1] }}</p>
  </div>

  <div class="op__foot">
    <div class="op__about">
      <p class="op__title">{{ id.title }}</p>
      <p class="op__phrase">{{ o.phrase }}</p>
    </div>
    <p class="op__dateline">{{ o.dateline }}</p>
  </div>
</section>

<!-- Note vocale d'introduction (remplace l'ancien bouton du hero) -->
<section class="op-voice" [attr.aria-label]="'Note vocale : ' + o.voice.label">
  <app-voice-wave
    variant="intro"
    [src]="o.voice.src"
    [label]="o.voice.label"
    [transcript]="o.voice.transcript"
  />
</section>
