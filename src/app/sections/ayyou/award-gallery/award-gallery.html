<dialog
  #dialog
  class="gallery"
  aria-labelledby="gallery-title"
  aria-describedby="gallery-subtitle"
  (close)="onClosed()"
  (cancel)="onCancel($event)"
  (click)="onBackdrop($event)"
>
  <div class="gallery__panel">
    <header class="gallery__head">
      <div>
        <h2 id="gallery-title" class="gallery__title">
          <span class="gallery__title-icon" aria-hidden="true"><app-icon name="trophy" /></span>
          {{ award().rank }} · {{ award().title }}
        </h2>
        <p id="gallery-subtitle" class="gallery__subtitle">
          {{ award().event }} · {{ award().venue }} · {{ award().date }}
        </p>
      </div>
      <button type="button" class="gallery__close" aria-label="Fermer la galerie" (click)="close()">
        <app-icon name="close" />
      </button>
    </header>

    @if (selected() === null) {
      <!-- Grille bento -->
      <ul class="gallery__grid">
        @for (photo of award().photos; track photo.src; let i = $index) {
          <li class="gallery__cell gallery__cell--{{ i + 1 }}">
            <button
              type="button"
              class="gallery__thumb"
              [attr.aria-label]="'Agrandir : ' + photo.caption"
              (click)="show(i, $event)"
            >
              <img
                class="gallery__img"
                [src]="photo.src"
                [alt]="photo.alt"
                [attr.width]="photo.width"
                [attr.height]="photo.height"
                loading="lazy"
                decoding="async"
              />
              <span class="gallery__caption">{{ photo.caption }}</span>
            </button>
          </li>
        }
      </ul>
    } @else {
      <!-- Photo en grand -->
      @let photo = award().photos[selected()!];
      <figure class="gallery__viewer" (keydown)="onViewerKey($event)">
        <div class="gallery__viewer-frame">
          <img class="gallery__viewer-img" [src]="photo.src" [alt]="photo.alt" decoding="async" />
        </div>
        <figcaption class="gallery__viewer-bar">
          <button type="button" class="gallery__back" (click)="back()">
            <app-icon name="arrow-left" />
            Retour à la galerie
          </button>
          <span class="gallery__viewer-caption">
            {{ photo.caption }}
            <span class="gallery__viewer-count">{{ selected()! + 1 }} / {{ award().photos.length }}</span>
          </span>
          <span class="gallery__nav">
            <button type="button" class="gallery__nav-btn" aria-label="Photo précédente" (click)="step(-1)">
              <app-icon name="arrow-left" />
            </button>
            <button type="button" class="gallery__nav-btn" aria-label="Photo suivante" (click)="step(1)">
              <app-icon name="arrow-right" />
            </button>
          </span>
        </figcaption>
      </figure>
    }
  </div>
</dialog>
