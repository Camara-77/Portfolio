<section id="top" class="hero" #root aria-labelledby="hero-title">
  <app-hero-sphere />

  <div class="container hero__grid">
    <div class="hero__text">
      <p class="hero__eyebrow" data-hero-fade>
        <span class="hero__dot" aria-hidden="true"></span>
        {{ id.locationShort }}
      </p>

      <h1
        id="hero-title"
        class="hero__name display"
        [attr.aria-label]="id.name"
        appTextReveal
        trigger="intro"
        [scramble]="true"
        [delay]="0.1"
      >
        @for (line of nameLines; track $index) {
          <span class="hero__line">{{ line }}{{ $last ? '' : ' ' }}</span>
        }
      </h1>

      <p class="hero__title" data-hero-fade>{{ id.title }}</p>
      <p class="hero__tagline lead" data-hero-fade>{{ id.tagline }}</p>

      <div class="hero__actions" data-hero-fade>
        <a appButton href="#projects">
          Voir mes projets
          <app-icon name="arrow-down" />
        </a>
        <a appButton variant="ghost" href="#contact">
          Me contacter
          <app-icon name="arrow-up-right" />
        </a>
      </div>
    </div>

    <div class="hero__visual" #visual>
      <div class="hero__portrait" data-hero-visual>
        <app-portrait [alt]="'Portrait de ' + id.name" />
      </div>

      @for (card of cards; track card.label; let i = $index) {
        <div class="hero__card hero__card--{{ i + 1 }}" data-hero-card>
          <span class="hero__card-inner" [class.hero__card-inner--award]="card.award">
            @if (card.award) {
              <app-icon name="trophy" />
            }
            {{ card.label }}
          </span>
        </div>
      }
    </div>
  </div>

  <a class="hero__scroll" href="#about" data-hero-fade>
    <span>Défiler</span>
    <span class="hero__scroll-line" aria-hidden="true"></span>
  </a>
</section>
