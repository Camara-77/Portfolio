<div class="vw" [class.is-playing]="playing()" [class.is-disabled]="!available()">
  <div class="vw__band">
    <canvas #canvas class="vw__canvas" aria-hidden="true"></canvas>

    <div class="vw__controls">
      <button
        type="button"
        class="vw__play"
        [disabled]="!available()"
        [attr.aria-label]="
          !available() ? label() + ' — bientôt disponible' : playing() ? 'Mettre en pause : ' + label() : 'Lire : ' + label()
        "
        [attr.aria-pressed]="available() ? playing() : null"
        (click)="toggle()"
      >
        <span class="vw__ring" #ring aria-hidden="true"></span>
        <app-icon [name]="playing() ? 'pause' : 'play'" />
      </button>
      <span class="vw__text">
        <span class="vw__label"><app-num-text [text]="label()" /></span>
        <span class="vw__meta">
          @if (!available()) {
            bientôt
          } @else {
            {{ duration() ? total() : '—' }}
          }
        </span>
      </span>
    </div>
  </div>

  <div class="vw__below">
    <div class="vw__progress">
      <input
        class="vw__range"
        type="range"
        min="0"
        [max]="duration() || 1"
        step="0.1"
        [value]="time()"
        [disabled]="!available()"
        [style.--p]="progress() + '%'"
        [attr.aria-label]="'Position dans : ' + label()"
        [attr.aria-valuetext]="elapsed() + ' sur ' + total()"
        (input)="onSeek($event)"
      />
      @if (duration()) {
        @for (m of visibleMarkers(); track m.label) {
          <button
            type="button"
            class="vw__marker"
            [style.left]="markerLeft(m.time)"
            [attr.aria-label]="'Aller à : ' + m.label"
            [title]="m.label"
            (click)="seekTo(m.time)"
          >
            <span class="vw__marker-label">{{ m.label }}</span>
          </button>
        }
      }
    </div>
    <div class="vw__row">
      <span class="vw__time">{{ elapsed() }}</span>
      @if (transcript().length) {
        <details class="vw__transcript">
          <summary>Lire la transcription</summary>
          @for (p of transcript(); track $index) {
            <p>{{ p }}</p>
          }
        </details>
      }
    </div>
  </div>

  @if (available()) {
    <audio
      #audio
      [src]="src()"
      preload="metadata"
      (play)="playing.set(true)"
      (pause)="playing.set(false)"
      (ended)="onEnded()"
      (timeupdate)="time.set(audio.currentTime)"
      (loadedmetadata)="duration.set(audio.duration)"
    ></audio>
  }
</div>
