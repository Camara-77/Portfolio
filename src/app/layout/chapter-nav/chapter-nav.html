<header class="nav">
  <div class="nav__inner">
    <a class="nav__logo" href="#top" aria-label="Retour au début">{{ initials }}</a>

    <nav class="nav__chapters" aria-label="Chapitres">
      <ol class="nav__list">
        @for (item of items; track item.id) {
          <li>
            <a
              class="nav__link"
              [href]="'#' + item.id"
              [class.is-active]="scroll.activeSection() === item.id"
              [attr.aria-current]="scroll.activeSection() === item.id ? 'step' : null"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ol>
    </nav>
  </div>
  <span class="nav__progress" aria-hidden="true"><span class="nav__progress-bar" #bar></span></span>
</header>
