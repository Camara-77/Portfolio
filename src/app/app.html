<a class="skip-link" href="#main">Aller au contenu</a>

<app-intro />
<app-ambient-background />
<app-navbar />

<main id="main" class="page">
  <app-hero />
  <app-about />
  <app-ayyou />

  <!-- Sections à venir : titres en place, contenu réel aux phases 4 et 5 -->
  @for (s of sections; track s.id) {
    <section class="section" [id]="s.id" [attr.aria-labelledby]="s.id + '-title'">
      <div class="container">
        <app-section-title [index]="s.index" [label]="s.label" [title]="s.label" [headingId]="s.id + '-title'" />
      </div>
    </section>
  }
</main>

<app-footer />
